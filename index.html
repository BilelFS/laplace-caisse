<html lang="fr">
<head>

<style>
:root{--bg:#0f0f0f;--panel:#1a1a1a;--panel2:#262626;--line:#333;--gold:#d4a843;--text:#f3f3f3;--muted:#9a9a9a;--danger:#e05252;--ok:#3fa86b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
input,select{font:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{height:58px;display:flex;align-items:center;padding:0 8px;background:#000;border-bottom:1px solid var(--line)}
header>*{margin:0 4px;flex-shrink:0}
.brand{color:var(--gold);font-weight:bold;font-size:19px;letter-spacing:2px}
.svc{padding:7px 12px;border-radius:20px;background:var(--panel2);font-size:14px;white-space:nowrap}
.svc b{color:var(--gold)}
.clock{color:var(--muted);font-size:14px;white-space:nowrap}
.spacer{flex:1;flex-shrink:1}
.hbtn{background:var(--panel2);padding:10px 12px;border-radius:10px;font-size:15px;white-space:nowrap}
.hbtn:active,.btn:active,.chip:active,.cat:active{filter:brightness(1.3)}
.pchip{font-size:13px;padding:7px 10px;border-radius:20px;white-space:nowrap}
.pchip.off{background:#4a1c1c;color:#ffb3b3}
.pchip.on{background:#16351f;color:#a6e3b8}
main{flex:1;display:-webkit-box;display:flex;min-height:0}
#cats{width:160px;flex-shrink:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line)}
.cat{display:block;width:100%;text-align:left;padding:11px 10px;border-left:6px solid transparent;border-bottom:1px solid var(--line)}
.cat .ic{font-size:26px;display:block;line-height:1.1}
.cat .fr{font-size:15px;font-weight:bold;display:block}
.cat .ar{font-size:14px;color:var(--muted);display:block}
.cat.sel{background:var(--panel2)}
#prods{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-auto-rows:122px;grid-gap:10px;align-content:start}
.prod{background:var(--panel2);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-top:5px solid #555;position:relative}
.prod:active{background:#383838}
.prod .ic{font-size:34px;line-height:1}
.prod .nm{font-size:15px;font-weight:bold;margin-top:4px;line-height:1.15}
.prod .ar{font-size:13px;color:var(--muted)}
.prod .pr{color:var(--gold);font-weight:bold;font-size:17px;margin-top:2px}
.prod .badge{position:absolute;top:4px;left:6px;background:var(--gold);color:#000;font-size:11px;font-weight:bold;padding:2px 6px;border-radius:8px}
.prod .cnt{position:absolute;top:4px;right:6px;background:var(--ok);color:#fff;font-size:15px;font-weight:bold;min-width:26px;height:26px;line-height:26px;border-radius:13px;padding:0 6px}
.prod.dim{opacity:.5}
#cart{width:340px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#lines{flex:1;overflow-y:auto;padding:4px 10px}
.empty{color:var(--muted);text-align:center;margin-top:40px;font-size:16px;line-height:1.6}
.ln{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ln .n{flex:1;font-size:15px;min-width:0}
.ln .n small{display:block;color:var(--muted)}
.q{display:flex;align-items:center;margin:0 6px}
.q button{width:40px;height:40px;border-radius:10px;background:var(--panel2);font-size:22px;font-weight:bold}
.q span{min-width:28px;text-align:center;font-weight:bold;font-size:17px}
.ln .t{width:62px;text-align:right;font-weight:bold}
#tot{padding:10px 12px;border-top:1px solid var(--line)}
.totrow{display:flex;justify-content:space-between;align-items:baseline}
.totrow .l{color:var(--muted);font-size:16px}
.totrow .v{font-size:34px;font-weight:bold;color:var(--gold)}
.acts{display:flex;margin-top:8px}
.acts .btn:first-child{flex:1;margin-right:8px}.acts .btn:last-child{flex:2}
.btn{padding:16px 14px;border-radius:12px;font-size:18px;font-weight:bold;background:var(--panel2)}
.btn.gold{background:var(--gold);color:#000}
.btn.red{background:var(--danger);color:#fff}
.btn.green{background:var(--ok);color:#fff}
.btn:disabled{opacity:.35}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:10}
.md{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:720px;max-width:95vw;max-height:94vh;overflow-y:auto;padding:18px 20px}
.md.sm{width:420px}.md.wide{width:900px}
.md h2{margin:0 0 12px;color:var(--gold);font-size:22px}
.md h3{margin:16px 0 6px;font-size:16px;color:#ddd}
.row{display:flex;flex-wrap:wrap;align-items:center;margin:4px -5px}
.row>*{margin:5px}
.chip{padding:14px 16px;border-radius:12px;background:var(--panel2);font-size:18px;font-weight:bold;min-width:76px}
.chip.sel{background:var(--gold);color:#000}
.inp{background:#000;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:17px;width:260px;max-width:100%}
.big{font-size:42px;font-weight:bold;color:var(--gold);line-height:1.1}
.disp{background:#000;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:36px;font-weight:bold;text-align:right;min-height:62px;color:var(--text)}
.muted{color:var(--muted)}.right{text-align:right}.small{font-size:13px}
.cols{display:flex;margin:0 -10px}.cols>div{flex:1;padding:0 10px;min-width:0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;margin-top:8px}
.kp button{height:58px;border-radius:12px;background:var(--panel2);font-size:26px;font-weight:bold}
.kp button:active{background:#444}
.pinbox{font-size:34px;letter-spacing:12px;text-align:center;padding:10px;background:#000;border-radius:12px;min-height:62px;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:normal}
.cx{text-decoration:line-through;opacity:.5}
#toast{position:fixed;bottom:18px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#000;border:1px solid var(--gold);padding:12px 20px;border-radius:12px;font-size:16px;z-index:30;display:none;max-width:90vw;text-align:center}
.pe{display:grid;grid-template-columns:1fr 110px;grid-gap:6px 10px;align-items:center}
.pe input{width:110px;font-size:16px;padding:8px}
label.f{display:block;font-size:13px;color:var(--muted);margin:6px 0 2px}
.warn{background:#3a2a0a;border:1px solid #7a5a12;color:#f3d48a;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
@media (max-width:1100px){#cats{width:130px}#cart{width:300px}.clock{display:none}.cat .ar{display:none}}
</style>
</head>
<body>

  cocktail:'🍹',jus_autre:'🧃',jus_bouteille:'🧃',coca:'🥤',fanta:'🥤',sprite:'🥤',eau05:'💧',eau15:'💧',croissant:'🥐',painchoc:'🍫',
  cake:'🍰',libanaise:'🥮',chicha_classique:'💨',chicha_parfumee:'🍏',chicha_speciale:'🍓',of_matin:'☀️',of_midi:'🌤️',of_speciale:'⭐',
  night_the:'🌙',night_boisson:'🌙',supp_amandes:'🌰',supp_pignons:'🌰'};
var OFFER_DETAIL = {of_matin:'Croissant + Espresso',of_midi:'Pain au chocolat + Jus',of_speciale:'Cappuccino + Pain choc + Jus',
  night_the:'Chicha + Thé menthe',night_boisson:'Chicha + Coca/Fanta/Sprite'};
var DEFAULT_SETTINGS = {h1:'LA PLACE CAFE',h2:'Votre moment, notre place',h3:'El Baten, Kairouan',footer:'Merci et a bientot !',
  drawerPin:2,printMode:'webusb',adminPin:'',kickOnSale:true};
var ADMIN_TTL = 120000;

var S = {menu:null, settings:null, cart:[], cat:'cafe', service:null, adminUntil:0};

/* ---------- utils ---------- */
function $(id){return document.getElementById(id)}
function each(list,fn){Array.prototype.forEach.call(list,fn)}
function fmt(m){return (m/1000).toFixed(3).replace('.',',')}
function parseDT(v){v=String(v==null?'':v).replace(',','.').trim();if(v===''||v==='.')return NaN;var n=parseFloat(v);return isNaN(n)?NaN:Math.round(n*1000)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad2(n){return (n<10?'0':'')+n}
function hm(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes())}
function dstr(ts){var d=new Date(ts);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()}
function toast(msg,ms){var t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},ms||2500)}
function findItem(id){for(var i=0;i<S.menu.length;i++){var c=S.menu[i];for(var j=0;j<c.items.length;j++){if(c.items[j][0]===id)return {cat:c,it:c.items[j]}}}return null}
function icon(id,cat){return ICONS[id]||cat.ic}
function catOf(id){for(var i=0;i<DEFAULT_MENU.length;i++)if(DEFAULT_MENU[i].id===id)return DEFAULT_MENU[i];return {col:'#555',ic:'•'}}
function svcLabel(t){return t==='matin'?'☀️ Matin':'🌙 Soir'}

/* ---------- IndexedDB ---------- */
var DB = {
  db:null,
  open:function(){var self=this;return new Promise(function(res,rej){
    var r=indexedDB.open('laplace-pos',1);
    r.onupgradeneeded=function(){var d=r.result;
      var s=d.createObjectStore('sales',{keyPath:'id'});s.createIndex('serviceId','serviceId');
      d.createObjectStore('services',{keyPath:'id'});d.createObjectStore('kv');};
    r.onsuccess=function(){self.db=r.result;res()};r.onerror=function(){rej(r.error)};})},
  run:function(store,mode,fn){var self=this;return new Promise(function(res,rej){
    var t=self.db.transaction(store,mode),s=t.objectStore(store),out,r=fn(s);
    if(r)r.onsuccess=function(){out=r.result};t.oncomplete=function(){res(out)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error||new Error('Transaction annulée'))};})},
  put:function(st,v,k){return this.run(st,'readwrite',function(s){return k===undefined?s.put(v):s.put(v,k)})},
  get:function(st,k){return this.run(st,'readonly',function(s){return s.get(k)})},
  all:function(st){return this.run(st,'readonly',function(s){return s.getAll()})},
  byService:function(id){return this.run('sales','readonly',function(s){return s.index('serviceId').getAll(id)})}
};

/* ---------- ESC/POS ---------- */
var W = 48;
function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[œ]/g,'oe').replace(/[^\x20-\x7e]/g,'?')}
function Esc(){this.b=[27,64,27,116,0]}
Esc.prototype.raw=function(){for(var i=0;i<arguments.length;i++)this.b.push(arguments[i]);return this};
Esc.prototype.text=function(s){s=ascii(s);for(var i=0;i<s.length;i++)this.b.push(s.charCodeAt(i));return this};
Esc.prototype.line=function(s){return this.text(s||'').raw(10)};
Esc.prototype.align=function(n){return this.raw(27,97,n)};
Esc.prototype.bold=function(on){return this.raw(27,69,on?1:0)};
Esc.prototype.size=function(n){return this.raw(29,33,n)};
Esc.prototype.sep=function(){return this.line(new Array(W+1).join('-'))};
Esc.prototype.lr=function(l,r,w){w=w||W;l=ascii(l);r=ascii(r);var sp=w-l.length-r.length;
  if(sp<1){l=l.slice(0,Math.max(0,w-r.length-1));sp=1}return this.line(l+new Array(sp+1).join(' ')+r)};
Esc.prototype.cut=function(){return this.raw(10,10,10,29,86,66,0)};
Esc.prototype.drawer=function(pin){return this.raw(27,112,pin===5?1:0,25,250)};
Esc.prototype.bytes=function(){return new Uint8Array(this.b)};

var Printer = {
  dev:null, ep:null, busy:Promise.resolve(),
  supported:function(){return !!navigator.usb},
  init:function(){var self=this;if(!this.supported())return Promise.resolve();
    navigator.usb.addEventListener('disconnect',function(e){if(e.device===self.dev){self.dev=null;printerStatus();toast('Imprimante débranchée',3500)}});
    navigator.usb.addEventListener('connect',function(e){self.open(e.device).then(function(){toast('Imprimante reconnectée')}).catch(function(){})});
    return navigator.usb.getDevices().then(function(ds){if(ds.length)return self.open(ds[0])}).catch(function(){})},
  request:function(){var self=this;return navigator.usb.requestDevice({filters:[]}).then(function(d){return self.open(d)})},
  open:function(d){var self=this;
    return (d.opened?Promise.resolve():d.open()).then(function(){if(d.configuration===null)return d.selectConfiguration(1)}).then(function(){
      var itfs=d.configuration.interfaces;
      for(var i=0;i<itfs.length;i++){var alts=itfs[i].alternates;
        for(var a=0;a<alts.length;a++){var eps=alts[a].endpoints;
          for(var e=0;e<eps.length;e++){if(eps[e].direction==='out'&&eps[e].type==='bulk'){
            var itf=itfs[i],num=itf.interfaceNumber,ep=eps[e].endpointNumber,alt=alts[a].alternateSetting;
            return (itf.claimed?Promise.resolve():d.claimInterface(num)).then(function(){if(alt)return d.selectAlternateInterface(num,alt)})
              .then(function(){self.dev=d;self.ep=ep;printerStatus()});}}}}
      throw new Error('Aucune sortie USB trouvée sur cet appareil');})},
  send:function(bytes){var self=this;
    if(S.settings.printMode==='rawbt'){rawbt(bytes);return Promise.resolve()}
    if(!this.dev)return Promise.reject(new Error('Imprimante non connectée'));
    var job=this.busy.then(function(){var p=Promise.resolve();
      for(var i=0;i<bytes.length;i+=4096){(function(chunk){p=p.then(function(){return self.dev.transferOut(self.ep,chunk)})})(bytes.slice(i,i+4096))}
      return p});
    this.busy=job.catch(function(){});return job},
  ready:function(){return S.settings.printMode==='rawbt'||!!this.dev}
};
function rawbt(bytes){var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  location.href='intent:base64,'+btoa(bin)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'}
function printerStatus(){var c=$('pchip'),ok=Printer.ready();c.className='pchip '+(ok?'on':'off');
  c.textContent=S.settings.printMode==='rawbt'?'RawBT':(ok?'Imprimante ✓':'Imprimante ✕')}
function kick(){return Printer.send(new Esc().drawer(S.settings.drawerPin).bytes())}

function ticketBytes(sale,withKick){
  var st=S.settings,e=new Esc();
  e.align(1).bold(1).size(17).line(st.h1).size(0).bold(0);
  if(st.h2)e.line(st.h2);if(st.h3)e.line(st.h3);
  e.line().align(0).lr('Ticket #'+sale.no,dstr(sale.ts)+' '+hm(sale.ts)).sep();
  sale.items.forEach(function(it){e.lr(it.qty+' x '+it.name,fmt(it.price*it.qty));
    if(OFFER_DETAIL[it.id])e.line('    ('+OFFER_DETAIL[it.id]+')')});
  e.sep().bold(1).size(1).lr('TOTAL',fmt(sale.total)+' DT',W/2).size(0).bold(0);
  if(sale.received){e.lr('Recu',fmt(sale.received));e.lr('Rendu',fmt(sale.change))}
  if(sale.cancelled)e.line().align(1).bold(1).line('*** ANNULE ***').bold(0);
  e.line().align(1).line(st.footer).cut();
  if(withKick)e.drawer(st.drawerPin);
  return e.bytes()}

/* ---------- UI helpers ---------- */
function modal(html,opts){opts=opts||{};var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="md '+(opts.cls||'')+'">'+html+'</div>';document.body.appendChild(ov);
  if(!opts.locked)ov.addEventListener('click',function(e){if(e.target===ov)close()});
  function close(){if(ov.parentNode)ov.parentNode.removeChild(ov)}
  ov.close=close;ov.q=function(s){return ov.querySelector(s)};return ov}
function confirmBox(msg,okLabel,cb,danger){var m=modal('<h2>Confirmation</h2><p style="font-size:17px;line-height:1.5">'+msg+'</p><div class="row" style="margin-top:12px"><button class="btn" id="cn">Non</button><button class="btn '+(danger?'red':'gold')+'" id="cy" style="flex:1">'+okLabel+'</button></div>',{cls:'sm'});
  m.q('#cn').onclick=m.close;m.q('#cy').onclick=function(){m.close();cb()}}
function keypad(el,opt){var v='';opt=opt||{};
  var keys=['1','2','3','4','5','6','7','8','9',opt.decimal?',':'C','0','⌫'];
  el.className='kp';el.innerHTML=keys.map(function(k){return '<button type="button" data-k="'+k+'">'+k+'</button>'}).join('');
  el.addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.dataset.k;
    if(k==='⌫')v=v.slice(0,-1);else if(k==='C')v='';
    else if(k===','){if(v.indexOf(',')<0)v=(v||'0')+','}
    else{if(opt.max&&v.length>=opt.max)return;var p=v.split(',');if(p.length>1&&p[1].length>=3)return;if(p[0].length>=5&&p.length===1)return;v=(v==='0'?'':v)+k}
    if(opt.onChange)opt.onChange(v)});
  return {set:function(x){v=x;if(opt.onChange)opt.onChange(v)},get:function(){return v}}}

/* ---------- gérant / PIN ---------- */
function pinModal(title,sub,locked,onDone){
  var m=modal('<h2>🔒 '+title+'</h2>'+(sub?'<div class="muted" style="margin-bottom:8px">'+sub+'</div>':'')+'<div class="pinbox" id="pd">—</div><div id="kp"></div>'+
    '<div class="row" style="margin-top:10px">'+(locked?'':'<button class="btn" id="pc">Annuler</button>')+'<button class="btn gold" id="po" style="flex:1">Valider</button></div>',{cls:'sm',locked:locked});
  var kp=keypad(m.q('#kp'),{max:6,onChange:function(v){m.q('#pd').textContent=v?v.replace(/./g,'●'):'—'}});
  if(!locked)m.q('#pc').onclick=m.close;
  m.q('#po').onclick=function(){onDone(kp.get(),m,kp)};return m}
function requireAdmin(cb){
  if(Date.now()<S.adminUntil){S.adminUntil=Date.now()+ADMIN_TTL;return cb()}
  pinModal('Code gérant','Réservé au gérant',false,function(v,m,kp){
    if(v===S.settings.adminPin){S.adminUntil=Date.now()+ADMIN_TTL;m.close();cb()}
    else{kp.set('');toast('Code incorrect')}})}
function setupPin(first,done){
  pinModal(first?'Créez le code gérant':'Nouveau code gérant','4 à 6 chiffres. Il protège réglages, rapports, tiroir et annulations.',first,function(v,m,kp){
    if(!/^\d{4,6}$/.test(v)){toast('4 à 6 chiffres');return}
    m.close();
    pinModal('Confirmez le code','Tapez le même code une deuxième fois',first,function(v2,m2,kp2){
      if(v2!==v){toast('Les codes ne correspondent pas');m2.close();setupPin(first,done);return}
      S.settings.adminPin=v;DB.put('kv',S.settings,'settings').then(function(){m2.close();S.adminUntil=Date.now()+ADMIN_TTL;toast('Code gérant enregistré');if(done)done()})})})}
function lockAdmin(){S.adminUntil=0}

/* ---------- render ---------- */
function offerActive(it){if(it.length<6)return false;var h=new Date().getHours();if(h<5)h+=24;return h>=it[4]&&h<it[5]}
function renderCats(){$('cats').innerHTML=S.menu.map(function(c){var col=catOf(c.id).col;
  return '<button class="cat'+(c.id===S.cat?' sel':'')+'" data-c="'+c.id+'" style="border-left-color:'+(c.id===S.cat?col:'transparent')+'"><span class="ic">'+c.ic+'</span><span class="fr">'+esc(c.fr)+'</span><span class="ar">'+esc(c.ar)+'</span></button>'}).join('')}
function qtyInCart(id){for(var i=0;i<S.cart.length;i++)if(S.cart[i].id===id)return S.cart[i].qty;return 0}
function renderProds(){var c=S.menu.filter(function(x){return x.id===S.cat})[0],col=catOf(c.id).col;
  $('prods').innerHTML=c.items.map(function(it){var timed=it.length>=6,act=offerActive(it),q=qtyInCart(it[0]);
    return '<button class="prod'+(timed&&!act?' dim':'')+'" data-p="'+it[0]+'" style="border-top-color:'+col+'">'+(act?'<span class="badge">Maintenant</span>':'')+(q?'<span class="cnt">'+q+'</span>':'')+
      '<span class="ic">'+icon(it[0],c)+'</span><span class="nm">'+esc(it[1])+'</span><span class="ar">'+esc(it[2])+'</span><span class="pr">'+fmt(it[3])+'</span></button>'}).join('')}
function cartTotal(){return S.cart.reduce(function(s,l){return s+l.price*l.qty},0)}
function renderCart(){
  $('lines').innerHTML=S.cart.length?S.cart.map(function(l,i){
    return '<div class="ln"><div class="n">'+esc(l.name)+'<small>'+fmt(l.price)+'</small></div><div class="q"><button data-m="'+i+'">−</button><span>'+l.qty+
      '</span><button data-a="'+i+'">+</button></div><div class="t">'+fmt(l.price*l.qty)+'</div></div>'}).join(''):'<div class="empty">🛒<br>Touchez un produit<br>pour l\'ajouter</div>';
  $('total').textContent=fmt(cartTotal());$('bPay').disabled=!S.cart.length;$('bClear').disabled=!S.cart.length;renderProds()}
function renderTop(){var s=S.service;
  $('svc').innerHTML=s?'<b>'+svcLabel(s.type)+'</b> · '+hm(s.openedAt):'Aucun service';
  var d=new Date();$('clock').textContent=dstr(d)+' '+hm(d)}
function renderAll(){renderCats();renderCart();renderTop();printerStatus()}

function addItem(id){var f=findItem(id);if(!f)return;
  if(!S.service){openService();return}
  for(var i=0;i<S.cart.length;i++){if(S.cart[i].id===id){S.cart[i].qty++;renderCart();return}}
  S.cart.push({id:id,name:f.it[1],cat:f.cat.id,price:f.it[3],qty:1});renderCart()}

function openService(){

  var m=modal('<div data-open-svc></div><h2>Ouvrir un service</h2><div class="row"><button class="chip" data-t="matin">☀️ Matin</button><button class="chip" data-t="soir">🌙 Soir</button></div>'+
    '<h3>Fond de caisse (argent déjà dans le tiroir)</h3><div class="disp" id="fd">0 DT</div><div id="kp"></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn gold" id="go" style="flex:1">Ouvrir le service</button></div>',{locked:true,cls:'sm'});
  function sel(){each(m.querySelectorAll('[data-t]'),function(b){b.className='chip'+(b.dataset.t===type?' sel':'')})}
  sel();each(m.querySelectorAll('[data-t]'),function(b){b.onclick=function(){type=b.dataset.t;sel()}});
  keypad(m.q('#kp'),{decimal:true,onChange:function(v){fl=v;m.q('#fd').textContent=(v||'0')+' DT'}});

    DB.put('services',s).then(function(){return DB.put('kv',s.id,'current')}).then(function(){S.service=s;renderTop();m.close();toast('Service '+(type==='matin'?'matin':'soir')+' ouvert')})
      .catch(function(e){toast('Erreur: '+e.message)})}}

function pay(){if(!S.cart.length)return;if(!S.service)return openService();
  var total=cartTotal(),received=total;
  var notes=[5000,10000,20000,50000].filter(function(n){return n>total});
  var m=modal('<h2>Encaisser</h2><div class="cols"><div>'+
    '<div class="muted">Total à payer</div><div class="big">'+fmt(total)+' DT</div>'+
    '<h3>Le client donne</h3><div class="row"><button class="chip sel" data-r="'+total+'">Exact</button>'+notes.map(function(n){return '<button class="chip" data-r="'+n+'">'+(n/1000)+' DT</button>'}).join('')+'</div>'+
    '<h3>À rendre</h3><div class="big" id="chg"></div></div>'+
    '<div><div class="muted">Autre montant reçu</div><div class="disp" id="rd">'+fmt(total)+'</div><div id="kp"></div></div></div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="cc">Retour</button><button class="btn green" id="ok" style="flex:1">✓ Valider la vente</button></div>',{cls:'wide'});
  function upd(){var c=received-total,el=m.q('#chg');el.textContent=(c>=0?fmt(c):'Manque '+fmt(-c))+' DT';el.style.color=c>=0?'':'var(--danger)';m.q('#ok').disabled=c<0}
  var kp=keypad(m.q('#kp'),{decimal:true,onChange:function(v){var n=parseDT(v);received=isNaN(n)?0:n;m.q('#rd').textContent=v||'0';
    each(m.querySelectorAll('[data-r]'),function(x){x.className='chip'});upd()}});
  each(m.querySelectorAll('[data-r]'),function(b){b.onclick=function(){received=+b.dataset.r;m.q('#rd').textContent=fmt(received);
    each(m.querySelectorAll('[data-r]'),function(x){x.className='chip'+(x===b?' sel':'')});upd()}});
  m.q('#cc').onclick=m.close;upd();
  m.q('#ok').onclick=function(){var btn=this;btn.disabled=true;
    DB.get('kv','seq').then(function(seq){seq=(seq||0)+1;
      var sale={id:uid(),no:seq,ts:Date.now(),serviceId:S.service.id,serviceType:S.service.type,items:S.cart.map(function(l){return {id:l.id,name:l.name,cat:l.cat,price:l.price,qty:l.qty}}),
        total:total,received:received,change:received-total,cancelled:false,synced:false};
      return DB.put('kv',seq,'seq').then(function(){return DB.put('sales',sale)}).then(function(){return sale})})
    .then(function(sale){m.close();S.cart=[];renderCart();afterSale(sale)}).catch(function(e){btn.disabled=false;toast('Erreur: '+e.message,4000)})}}

function afterSale(sale){var st=S.settings;

    else toast('Imprimante non connectée : ouvrez le tiroir à la clé',4000)}
  var m=modal('<h2>✓ Vente enregistrée</h2><div class="muted">Ticket #'+sale.no+' · Rendre au client</div><div class="big" style="font-size:56px">'+fmt(sale.change)+' DT</div>'+

function clearCart(){if(!S.cart.length)return;confirmBox('Vider le panier ('+fmt(cartTotal())+' DT) ?','Vider',function(){S.cart=[];renderCart()},true)}

/* ---------- ventes / annulation ---------- */
function showHistory(){if(!S.service)return toast('Aucun service ouvert');

function openDrawer(){if(!S.service)return toast('Ouvrez d\'abord un service');
  requireAdmin(function(){kick().then(function(){S.service.drawerOpens=(S.service.drawerOpens||0)+1;return DB.put('services',S.service)})
    .then(function(){toast('Tiroir ouvert (noté dans le rapport)')}).catch(function(e){toast('Tiroir : '+e.message,4000)})})}

/* ---------- rapports ---------- */
function summarize(svc,sales){var ok=sales.filter(function(s){return !s.cancelled}),cx=sales.filter(function(s){return s.cancelled});
  var prods={};ok.forEach(function(s){s.items.forEach(function(i){var p=prods[i.id]||(prods[i.id]={name:i.name,qty:0,amt:0});p.qty+=i.qty;p.amt+=i.qty*i.price})});
  var list=Object.keys(prods).map(function(k){return prods[k]}).sort(function(a,b){return b.amt-a.amt});
  var ca=ok.reduce(function(t,s){return t+s.total},0);
  return {svc:svc,count:ok.length,ca:ca,cxCount:cx.length,cxAmt:cx.reduce(function(t,s){return t+s.total},0),list:list,expected:svc.float+ca}}
function ecart(r){return r.svc.counted==null?null:r.svc.counted-r.expected}
function reportBytes(r){var s=r.svc,e=new Esc(),d=ecart(r);
  e.align(1).bold(1).size(17).line(S.settings.h1).size(0).line('RAPPORT SERVICE '+(s.type==='matin'?'MATIN':'SOIR')).bold(0)
   .line(dstr(s.openedAt)+' '+hm(s.openedAt)+' - '+(s.closedAt?hm(s.closedAt):'en cours')).align(0).sep();
  r.list.forEach(function(p){e.lr(p.qty+' x '+p.name,fmt(p.amt))});
  e.sep().bold(1).lr('CHIFFRE D\'AFFAIRES',fmt(r.ca)+' DT').bold(0).lr('Nombre de ventes',String(r.count))
   .lr('Annulations',r.cxCount+' ('+fmt(r.cxAmt)+')').lr('Ouvertures tiroir manuelles',String(s.drawerOpens||0)).sep()
   .lr('Fond de caisse',fmt(s.float)).lr('Attendu en caisse',fmt(r.expected));
  if(d!=null){e.lr('Compte',fmt(s.counted)).bold(1).lr('ECART',(d>=0?'+':'')+fmt(d)).bold(0)}
  return e.cut().bytes()}
function reportHtml(r){var s=r.svc,d=ecart(r);
  return '<div class="muted">'+svcLabel(s.type)+' · '+dstr(s.openedAt)+' '+hm(s.openedAt)+' → '+(s.closedAt?hm(s.closedAt):'en cours')+'</div>'+
  '<div class="cols" style="margin-top:6px"><div><div class="muted">Chiffre d\'affaires</div><div class="big">'+fmt(r.ca)+' DT</div></div>'+
  (d!=null?'<div><div class="muted">Écart de caisse</div><div class="big" style="color:'+(d<0?'var(--danger)':'var(--ok)')+'">'+(d>=0?'+':'')+fmt(d)+'</div></div>':'')+'</div>'+
  '<table style="margin-top:8px"><tr><td>Ventes</td><td class="right">'+r.count+'</td></tr><tr><td>Annulations</td><td class="right">'+r.cxCount+' ('+fmt(r.cxAmt)+' DT)</td></tr>'+
  '<tr><td>Ouvertures manuelles du tiroir</td><td class="right">'+(s.drawerOpens||0)+'</td></tr><tr><td>Fond de caisse</td><td class="right">'+fmt(s.float)+'</td></tr>'+
  '<tr><td>Attendu en caisse</td><td class="right">'+fmt(r.expected)+'</td></tr>'+(d!=null?'<tr><td>Compté</td><td class="right">'+fmt(s.counted)+'</td></tr>':'')+
  '</table><h3>Produits</h3>'+(r.list.length?'<table><tr><th>Produit</th><th class="right">Qté</th><th class="right">Montant</th></tr>'+
  r.list.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td class="right">'+p.qty+'</td><td class="right">'+fmt(p.amt)+'</td></tr>'}).join('')+'</table>':'<div class="muted">Aucune vente</div>')}
function printReport(r){Printer.send(reportBytes(r)).then(function(){toast('Rapport envoyé')}).catch(function(e){toast('Impression : '+e.message,4000)})}

function closeService(){if(!S.service)return toast('Aucun service ouvert');
  if(S.cart.length)return toast('Encaissez ou videz le panier avant de clôturer',3500);
  var cnt='';
  var m=modal('<h2>Clôturer le service '+svcLabel(S.service.type)+'</h2><div class="muted">Comptez tout l\'argent du tiroir (billets + pièces) et tapez le total.</div>'+
    '<div class="disp" id="cd" style="margin-top:10px">0 DT</div><div id="kp"></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="cc">Retour</button><button class="btn red" id="ok" style="flex:1">Clôturer</button></div>',{cls:'sm'});
  keypad(m.q('#kp'),{decimal:true,onChange:function(v){cnt=v;m.q('#cd').textContent=(v||'0')+' DT'}});
  m.q('#cc').onclick=m.close;
  m.q('#ok').onclick=function(){var v=parseDT(cnt);if(isNaN(v))return toast('Tapez l\'argent compté');
    confirmBox('Confirmer : '+fmt(v)+' DT dans le tiroir ?','Clôturer',function(){
      var s=S.service;DB.byService(s.id).then(function(sales){var r=summarize(s,sales);
        s.closedAt=Date.now();s.counted=v;s.expected=r.expected;s.synced=false;
        return DB.put('services',s).then(function(){return DB.put('kv',null,'current')}).then(function(){return summarize(s,sales)})})
      .then(function(r2){S.service=null;renderTop();m.close();lockAdmin();
        var m2=modal('<h2>✓ Service clôturé</h2><p class="muted">Le rapport (chiffre d\'affaires et écart) est réservé au gérant.</p>'+
          '<div class="row" style="margin-top:12px"><button class="btn" id="vr">🔒 Rapport</button><button class="btn gold" id="nx" style="flex:1">Ouvrir le service suivant</button></div>',{cls:'sm',locked:true});
        m2.q('#vr').onclick=function(){requireAdmin(function(){var m3=modal('<h2>Rapport du service</h2>'+reportHtml(r2)+'<div class="row" style="margin-top:12px"><button class="btn" id="p3">🖨️ Imprimer</button><button class="btn gold" id="c3" style="flex:1">Fermer</button></div>');
          m3.q('#p3').onclick=function(){printReport(r2)};m3.q('#c3').onclick=m3.close})};
        m2.q('#nx').onclick=function(){m2.close();openService()}})
      .catch(function(e){toast('Erreur: '+e.message,4000)})})}}

function reports(){requireAdmin(function(){DB.all('services').then(function(svcs){svcs.sort(function(a,b){return b.openedAt-a.openedAt});svcs=svcs.slice(0,60);
  if(!svcs.length)return toast('Aucun service enregistré');
  var m=modal('<h2>🔒 Rapports</h2><div class="row"><select class="inp" id="sv" style="width:auto">'+svcs.map(function(s,i){return '<option value="'+i+'">'+dstr(s.openedAt)+' · '+(s.type==='matin'?'Matin':'Soir')+(s.closedAt?'':' (en cours)')+'</option>'}).join('')+

  var cur=null;m.q('#cl').onclick=m.close;
  function show(i){var s=svcs[i];DB.byService(s.id).then(function(sales){cur=summarize(s,sales);m.q('#rb').innerHTML=reportHtml(cur)})}
  m.q('#sv').onchange=function(){show(+this.value)};show(0);
  m.q('#pr').onclick=function(){if(cur)printReport(cur)};
  m.q('#day').onclick=function(){var d=dstr(svcs[+m.q('#sv').value].openedAt);var same=svcs.filter(function(s){return dstr(s.openedAt)===d});

      var ca=rs.reduce(function(t,r){return t+r.ca},0),n=rs.reduce(function(t,r){return t+r.count},0);cur=null;
      m.q('#rb').innerHTML='<h3>Journée du '+d+'</h3><table>'+rs.map(function(r){var e=ecart(r);return '<tr><td>'+svcLabel(r.svc.type)+'</td><td class="right">'+r.count+' ventes</td><td class="right">'+fmt(r.ca)+' DT</td><td class="right">'+(e==null?'en cours':'écart '+(e>=0?'+':'')+fmt(e))+'</td></tr>'}).join('')+
        '<tr><td><b>Total</b></td><td class="right"><b>'+n+'</b></td><td class="right"><b>'+fmt(ca)+' DT</b></td><td></td></tr></table>'})}})})}

/* ---------- réglages ---------- */
function settings(){requireAdmin(function(){var st=S.settings;
  var m=modal('<h2>🔒 Réglages</h2>'+
    '<h3>Imprimante et tiroir</h3><div class="row"><span>'+(st.printMode==='rawbt'?'Mode RawBT':(Printer.dev?'✅ Sewoo connectée en USB':'❌ Non connectée'))+'</span></div>'+
    (Printer.supported()?'':'<div class="warn">Ce navigateur ne gère pas l\'USB direct. Mettez Chrome à jour ou utilisez le mode RawBT.</div>')+
    '<div class="row"><button class="hbtn" id="con">🔌 Connecter l\'imprimante USB</button><button class="hbtn" id="tp">Test ticket</button><button class="hbtn" id="td">Test tiroir</button></div>'+
    '<div class="row"><div><label class="f">Mode d\'impression</label><select class="inp" id="pm" style="width:auto"><option value="webusb">USB direct (WebUSB)</option><option value="rawbt">App RawBT</option></select></div>'+
    '<div><label class="f">Broche du tiroir</label><select class="inp" id="dp" style="width:auto"><option value="2">2 (standard)</option><option value="5">5</option></select></div></div>'+
    '<div class="row"><label style="font-size:16px"><input type="checkbox" id="ks" style="width:20px;height:20px;vertical-align:middle"> Ouvrir le tiroir à chaque vente</label></div>'+
    '<h3>Texte du ticket</h3><div class="row"><div><label class="f">Ligne 1 (en grand)</label><input class="inp" id="h1"></div><div><label class="f">Ligne 2</label><input class="inp" id="h2"></div>'+
    '<div><label class="f">Ligne 3</label><input class="inp" id="h3"></div><div><label class="f">Bas du ticket</label><input class="inp" id="ft"></div></div>'+
    '<h3>Code gérant</h3><div class="row"><button class="hbtn" id="cp">Changer le code gérant</button><button class="hbtn" id="lk">🔒 Verrouiller maintenant</button></div>'+
    '<h3>Prix (DT)</h3><div class="pe" id="pe"></div>'+
    '<h3>Sauvegarde</h3><div class="row"><button class="hbtn" id="ex">⬇️ Exporter les ventes (JSON)</button><button class="hbtn" id="rs">Rétablir les prix d\'origine</button></div>'+
    '<div class="muted small" style="margin-top:8px">Version '+VERSION+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="cc">Fermer</button><button class="btn gold" id="sv" style="flex:1">Enregistrer</button></div>');
  m.q('#pm').value=st.printMode;m.q('#dp').value=String(st.drawerPin);m.q('#ks').checked=!!st.kickOnSale;
  m.q('#h1').value=st.h1;m.q('#h2').value=st.h2;m.q('#h3').value=st.h3;m.q('#ft').value=st.footer;
  var pe='';S.menu.forEach(function(c){c.items.forEach(function(it){pe+='<span>'+icon(it[0],c)+' '+esc(it[1])+'</span><input class="inp" data-id="'+it[0]+'" inputmode="decimal" value="'+fmt(it[3])+'">'})});
  m.q('#pe').innerHTML=pe;
  m.q('#con').onclick=function(){if(!Printer.supported())return toast('USB non disponible : utilisez le mode RawBT',4000);
    Printer.request().then(function(){toast('Imprimante connectée');m.close();settings()}).catch(function(e){if(e&&e.name==='NotFoundError')return;toast('Connexion : '+e.message,4000)})};
  m.q('#tp').onclick=function(){var demo={no:0,ts:Date.now(),items:[{id:'espresso',name:'Espresso',price:2500,qty:2},{id:'of_matin',name:'Offre matin',price:3500,qty:1}],total:8500,received:10000,change:1500};
    Printer.send(ticketBytes(demo,false)).then(function(){toast('Test envoyé')}).catch(function(e){toast(e.message,4000)})};
  m.q('#td').onclick=function(){kick().then(function(){toast('Commande tiroir envoyée')}).catch(function(e){toast(e.message,4000)})};
  m.q('#cp').onclick=function(){m.close();setupPin(false)};
  m.q('#lk').onclick=function(){lockAdmin();m.close();toast('Verrouillé')};
  m.q('#ex').onclick=exportData;
  m.q('#rs').onclick=function(){confirmBox('Remettre tous les prix d\'origine ?','Rétablir',function(){S.menu=JSON.parse(JSON.stringify(DEFAULT_MENU));DB.put('kv',S.menu,'menu').then(function(){m.close();renderAll();toast('Prix rétablis')})},true)};
  m.q('#cc').onclick=m.close;
  m.q('#sv').onclick=function(){var prices={},bad=null;
    each(m.querySelectorAll('#pe input'),function(inp){var v=parseDT(inp.value);if(isNaN(v)||v<0){if(!bad)bad=inp}else prices[inp.dataset.id]=v});
    if(bad){bad.style.borderColor='var(--danger)';bad.scrollIntoView({block:'center'});return toast('Prix invalide')}
    Object.keys(prices).forEach(function(id){var f=findItem(id);if(f)f.it[3]=prices[id]});
    S.settings={h1:m.q('#h1').value,h2:m.q('#h2').value,h3:m.q('#h3').value,footer:m.q('#ft').value,drawerPin:+m.q('#dp').value,
      printMode:m.q('#pm').value,adminPin:st.adminPin,kickOnSale:m.q('#ks').checked};
    S.cart.forEach(function(l){var f=findItem(l.id);if(f)l.price=f.it[3]});
    Promise.all([DB.put('kv',S.settings,'settings'),DB.put('kv',S.menu,'menu')]).then(function(){m.close();renderAll();toast('Réglages enregistrés')})}})}

function exportData(){Promise.all([DB.all('services'),DB.all('sales')]).then(function(r){
  var blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),version:VERSION,services:r[0],sales:r[1]},null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='laplace-ventes-'+dstr(Date.now()).replace(/\//g,'-')+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.parentNode.removeChild(a)},1000);toast('Export téléchargé')})}

/* ---------- events ---------- */
$('cats').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;S.cat=b.dataset.c;renderCats();renderProds();$('prods').scrollTop=0});
$('prods').addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(b)addItem(b.dataset.p)});
$('lines').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.a!=null)S.cart[+b.dataset.a].qty++;
  if(b.dataset.m!=null){var l=S.cart[+b.dataset.m];l.qty--;if(l.qty<=0)S.cart.splice(+b.dataset.m,1)}renderCart()});
$('bClear').onclick=clearCart;$('bPay').onclick=pay;$('bHist').onclick=showHistory;$('bReport').onclick=reports;
$('bClose').onclick=closeService;$('bSet').onclick=settings;$('bDrawer').onclick=openDrawer;
$('pchip').onclick=function(){if(!Printer.ready())settings()};
setInterval(function(){renderTop();if(S.cat==='offres')renderProds()},30000);
document.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- boot ---------- */
DB.open().then(function(){return Promise.all([DB.get('kv','menu'),DB.get('kv','settings'),DB.get('kv','current')])})
.then(function(r){S.menu=r[0]||JSON.parse(JSON.stringify(DEFAULT_MENU));
  S.settings=Object.assign({},DEFAULT_SETTINGS,r[1]||{});
  return r[2]?DB.get('services',r[2]):null})
.then(function(svc){S.service=svc||null;renderAll();
  function next(){if(!S.service)openService()}
  if(!S.settings.adminPin)setupPin(true,next);else next();
  return Printer.init()})
.then(printerStatus)
.catch(function(e){document.body.innerHTML='<p style="padding:20px;color:#fff">Erreur au démarrage : '+esc(e&&e.message||e)+'</p>'});

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
</script>
</body>
</html>
