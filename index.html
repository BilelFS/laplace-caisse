<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="common.css">
<title>La Place Caisse</title>
<style>
html,body{overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
header{height:60px;display:flex;align-items:center;padding:0 6px;background:#000;border-bottom:1px solid var(--line);flex-shrink:0}
header>*{margin:0 4px;flex-shrink:0}
.brand{color:var(--gold);font-weight:bold;font-size:19px;letter-spacing:2px}
.svc{padding:8px 12px;border-radius:20px;background:var(--panel2);font-size:16px;white-space:nowrap}
.svc b{color:var(--gold)}
.clock{color:var(--muted);font-size:15px;white-space:nowrap}
.spacer{flex:1;flex-shrink:1}
.pchip{font-size:14px;padding:8px 10px;border-radius:20px;white-space:nowrap}
.pchip.off{background:#4a1c1c;color:#ffc2c2}.pchip.on{background:#16351f;color:#b8eccb}.pchip.wait{background:#3a2a0a;color:#f3d48a}
header .hbtn{font-size:16px}
main{flex:1;display:flex;min-height:0}
#cats{width:170px;flex-shrink:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line)}
.cat{display:flex;align-items:center;width:100%;text-align:left;padding:12px 10px;border-left:7px solid transparent;border-bottom:1px solid var(--line);min-height:70px}
.cat .ic{font-size:30px;width:40px;flex-shrink:0;text-align:center}
.cat .tx{margin-left:6px;min-width:0}
.cat .fr{font-size:17px;font-weight:bold;display:block;line-height:1.15}
.cat .ar{font-size:15px;color:var(--muted);display:block}
.cat.sel{background:#2c2c2c}
#prods{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:148px;grid-gap:10px;align-content:start}
.prod{background:var(--panel2);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-top:6px solid #555;position:relative}
.prod:active{background:#3a3a3a;-webkit-transform:scale(.97);transform:scale(.97)}
.prod .ic{font-size:42px;line-height:1}
.prod .nm{font-size:18px;font-weight:bold;margin-top:6px;line-height:1.15;color:#fff}
.prod .ar{font-size:15px;color:#bdbdbd;margin-top:1px}
.prod .pr{color:var(--gold);font-weight:bold;font-size:21px;margin-top:3px}
.prod .badge{position:absolute;top:5px;left:6px;background:var(--gold);color:#000;font-size:12px;font-weight:bold;padding:3px 7px;border-radius:8px}
.prod .cnt{position:absolute;top:5px;right:6px;background:var(--ok);color:#fff;font-size:18px;font-weight:bold;min-width:32px;height:32px;line-height:32px;border-radius:16px;padding:0 7px}
.prod.dim{opacity:.45}
#cart{width:350px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#lines{flex:1;overflow-y:auto;padding:4px 10px}
.empty{color:var(--muted);text-align:center;margin-top:50px;font-size:18px;line-height:1.6}
.ln{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ln .ic{font-size:26px;width:34px;flex-shrink:0}
.ln .n{flex:1;font-size:17px;font-weight:bold;min-width:0;line-height:1.2}
.ln .n small{display:block;color:var(--muted);font-weight:normal;font-size:14px}
.q{display:flex;align-items:center;margin:0 6px}
.q button{width:44px;height:44px;border-radius:10px;background:var(--panel3);font-size:24px;font-weight:bold}
.q span{min-width:30px;text-align:center;font-weight:bold;font-size:20px}
.ln .t{width:64px;text-align:right;font-weight:bold;font-size:17px}
#tot{padding:10px 12px;border-top:1px solid var(--line)}
.totrow{display:flex;justify-content:space-between;align-items:baseline}
.totrow .l{color:var(--muted);font-size:18px}
.totrow .v{font-size:44px;font-weight:bold;color:var(--gold);line-height:1}
.acts{display:flex;margin-top:10px}
.acts .btn{min-height:64px;font-size:20px}
.acts .btn:first-child{flex:1;margin-right:8px}.acts .btn:last-child{flex:2}
.payamt{font-size:60px}
@media (max-width:1100px){#cats{width:140px}.cat .ar{display:none}#cart{width:310px}.clock{display:none}#prods{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}}
@media (max-width:900px){.brand{display:none}header .hbtn{padding:10px 9px;font-size:15px}}
@media (max-height:600px){#prods{grid-auto-rows:128px}.prod .ic{font-size:34px}.totrow .v{font-size:36px}.acts .btn{min-height:54px}.cat{min-height:56px;padding:8px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">LA PLACE</div>
    <div class="svc" id="svc">Aucun service</div>
    <div class="clock" id="clock"></div>
    <div class="spacer"></div>
    <div class="pchip off" id="pchip">🖨️ ✕</div>
    <div class="pchip off" id="cchip" style="display:none">☁️</div>
    <button class="hbtn" id="bHist">🧾 Ventes</button>
    <button class="hbtn" id="bClose">Clôturer</button>
    <button class="hbtn" id="bDrawer">🔒 Tiroir</button>
    <button class="hbtn" id="bAdmin">🔒 Gérant</button>
  </header>
  <main>
    <nav id="cats"></nav>
    <section id="prods"></section>
    <aside id="cart">
      <div id="lines"></div>
      <div id="tot">
        <div class="totrow"><span class="l">Total</span><span class="v" id="total">0,000</span></div>
        <div class="acts">
          <button class="btn" id="bClear">Vider</button>
          <button class="btn gold" id="bPay">Encaisser</button>
        </div>
      </div>
    </aside>
  </main>
</div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
'use strict';
var VERSION='3.1';
var DEFAULT_SETTINGS={h1:'LA PLACE CAFE',h2:'Votre moment, notre place',h3:'El Baten, Kairouan',footer:'Merci et a bientot !',drawerPin:2,printMode:'webusb',adminPin:'',kickOnSale:true};
var ADMIN_TTL=120000;
var S={menu:null,menuTs:0,settings:null,cart:[],cat:null,service:null,adminUntil:0,auth:null};

/* ---------- IndexedDB ---------- */
var DB={db:null,
  open:function(){var self=this;return new Promise(function(res,rej){var r=indexedDB.open('laplace-pos',1);
    r.onupgradeneeded=function(){var d=r.result;var s=d.createObjectStore('sales',{keyPath:'id'});s.createIndex('serviceId','serviceId');d.createObjectStore('services',{keyPath:'id'});d.createObjectStore('kv')};
    r.onsuccess=function(){self.db=r.result;res()};r.onerror=function(){rej(r.error)}})},
  run:function(store,mode,fn){var self=this;return new Promise(function(res,rej){var t=self.db.transaction(store,mode),s=t.objectStore(store),out,r=fn(s);
    if(r)r.onsuccess=function(){out=r.result};t.oncomplete=function(){res(out)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error||new Error('Transaction annulée'))}})},
  put:function(st,v,k){return this.run(st,'readwrite',function(s){return k===undefined?s.put(v):s.put(v,k)})},
  get:function(st,k){return this.run(st,'readonly',function(s){return s.get(k)})},
  all:function(st){return this.run(st,'readonly',function(s){return s.getAll()})},
  byService:function(id){return this.run('sales','readonly',function(s){return s.index('serviceId').getAll(id)})}};

/* ---------- ESC/POS ---------- */
var W=48;
function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[œ]/g,'oe').replace(/[^\x20-\x7e]/g,'?')}
function Esc(){this.b=[27,64,27,116,0]}
Esc.prototype.raw=function(){for(var i=0;i<arguments.length;i++)this.b.push(arguments[i]);return this};
Esc.prototype.text=function(s){s=ascii(s);for(var i=0;i<s.length;i++)this.b.push(s.charCodeAt(i));return this};
Esc.prototype.line=function(s){return this.text(s||'').raw(10)};
Esc.prototype.align=function(n){return this.raw(27,97,n)};
Esc.prototype.bold=function(on){return this.raw(27,69,on?1:0)};
Esc.prototype.size=function(n){return this.raw(29,33,n)};
Esc.prototype.sep=function(){return this.line(new Array(W+1).join('-'))};
Esc.prototype.lr=function(l,r,w){w=w||W;l=ascii(l);r=ascii(r);var sp=w-l.length-r.length;if(sp<1){l=l.slice(0,Math.max(0,w-r.length-1));sp=1}return this.line(l+new Array(sp+1).join(' ')+r)};
Esc.prototype.cut=function(){return this.raw(10,10,10,29,86,66,0)};
Esc.prototype.drawer=function(pin){return this.raw(27,112,pin===5?1:0,25,250)};
Esc.prototype.bytes=function(){return new Uint8Array(this.b)};

var Printer={dev:null,ep:null,busy:Promise.resolve(),
  supported:function(){return !!navigator.usb},
  init:function(){var self=this;if(!this.supported())return Promise.resolve();
    navigator.usb.addEventListener('disconnect',function(e){if(e.device===self.dev){self.dev=null;printerStatus();toast('Imprimante débranchée',3500)}});
    navigator.usb.addEventListener('connect',function(e){self.open(e.device).then(function(){toast('Imprimante reconnectée')}).catch(function(){})});
    return navigator.usb.getDevices().then(function(ds){if(ds.length)return self.open(ds[0])}).catch(function(){})},
  request:function(){var self=this;return navigator.usb.requestDevice({filters:[]}).then(function(d){return self.open(d)})},
  open:function(d){var self=this;
    return (d.opened?Promise.resolve():d.open()).then(function(){if(d.configuration===null)return d.selectConfiguration(1)}).then(function(){
      var itfs=d.configuration.interfaces;
      for(var i=0;i<itfs.length;i++){var alts=itfs[i].alternates;for(var a=0;a<alts.length;a++){var eps=alts[a].endpoints;
        for(var e=0;e<eps.length;e++){if(eps[e].direction==='out'&&eps[e].type==='bulk'){var itf=itfs[i],num=itf.interfaceNumber,ep=eps[e].endpointNumber,alt=alts[a].alternateSetting;
          return (itf.claimed?Promise.resolve():d.claimInterface(num)).then(function(){if(alt)return d.selectAlternateInterface(num,alt)}).then(function(){self.dev=d;self.ep=ep;printerStatus()})}}}}
      throw new Error('Aucune sortie USB trouvée sur cet appareil')})},
  send:function(bytes){var self=this;if(S.settings.printMode==='rawbt'){rawbt(bytes);return Promise.resolve()}
    if(!this.dev)return Promise.reject(new Error('Imprimante non connectée'));
    var job=this.busy.then(function(){var p=Promise.resolve();for(var i=0;i<bytes.length;i+=4096){(function(c){p=p.then(function(){return self.dev.transferOut(self.ep,c)})})(bytes.slice(i,i+4096))}return p});
    this.busy=job.catch(function(){});return job},
  ready:function(){return S.settings.printMode==='rawbt'||!!this.dev}};
function rawbt(bytes){var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);location.href='intent:base64,'+btoa(bin)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'}
function printerStatus(){var c=$('pchip'),ok=Printer.ready();c.className='pchip '+(ok?'on':'off');c.textContent=S.settings.printMode==='rawbt'?'🖨️ RawBT':(ok?'🖨️ ✓':'🖨️ ✕')}
function kick(){return Printer.send(new Esc().drawer(S.settings.drawerPin).bytes())}
function ticketBytes(sale,withKick){var st=S.settings,e=new Esc();
  e.align(1).bold(1).size(17).line(st.h1).size(0).bold(0);if(st.h2)e.line(st.h2);if(st.h3)e.line(st.h3);
  e.line().align(0).lr('Ticket #'+sale.no,dstr(sale.ts)+' '+hm(sale.ts)).sep();
  sale.items.forEach(function(it){e.lr(it.qty+' x '+it.name,fmt(it.price*it.qty));if(it.detail)e.line('    ('+it.detail+')')});
  e.sep().bold(1).size(1).lr('TOTAL',fmt(sale.total)+' DT',W/2).size(0).bold(0);
  if(sale.received){e.lr('Recu',fmt(sale.received));e.lr('Rendu',fmt(sale.change))}
  if(sale.cancelled)e.line().align(1).bold(1).line('*** ANNULE ***').bold(0);
  e.line().align(1).line(st.footer).cut();if(withKick)e.drawer(st.drawerPin);return e.bytes()}

/* ---------- gérant / PIN ---------- */
function pinModal(title,sub,locked,onDone){
  var m=modal({title:'🔒 '+title,cls:'sm',locked:locked,body:(sub?'<div class="muted" style="margin-bottom:8px">'+sub+'</div>':'')+'<div class="pinbox" data-pd>—</div><div data-kp></div>',
    foot:(locked?'':'<button class="btn" data-pc>Annuler</button>')+'<button class="btn gold main" data-po>Valider</button>'});
  var kp=keypad(m.q('[data-kp]'),{max:6,onChange:function(v){m.q('[data-pd]').textContent=v?v.replace(/./g,'●'):'—'}});
  if(!locked)m.q('[data-pc]').onclick=m.close;m.q('[data-po]').onclick=function(){onDone(kp.get(),m,kp)};return m}
function requireAdmin(cb){if(Date.now()<S.adminUntil){S.adminUntil=Date.now()+ADMIN_TTL;return cb()}
  pinModal('Code gérant','Réservé au gérant',false,function(v,m,kp){if(v===S.settings.adminPin){S.adminUntil=Date.now()+ADMIN_TTL;m.close();cb()}else{kp.set('');toast('Code incorrect')}})}
function setupPin(first,done){
  pinModal(first?'Créez le code gérant':'Nouveau code gérant','4 à 6 chiffres. Il protège l\'espace gérant, le tiroir et les annulations.',first,function(v,m){
    if(!/^\d{4,6}$/.test(v)){toast('4 à 6 chiffres');return}m.close();
    pinModal('Confirmez le code','Tapez le même code une deuxième fois',first,function(v2,m2){
      if(v2!==v){toast('Les codes ne correspondent pas');m2.close();setupPin(first,done);return}
      S.settings.adminPin=v;DB.put('kv',S.settings,'settings').then(function(){m2.close();S.adminUntil=Date.now()+ADMIN_TTL;toast('Code gérant enregistré');if(done)done()})})})}
function lockAdmin(){S.adminUntil=0}

/* ---------- affichage ---------- */
function visibleCats(){return S.menu.filter(function(c){return c.items.some(function(i){return !i.off})})}
function catColor(id){var c=S.menu.filter(function(x){return x.id===id})[0];return c?c.col:'#555'}
function renderCats(){var cats=visibleCats();if(!cats.some(function(c){return c.id===S.cat}))S.cat=cats[0]?cats[0].id:null;
  $('cats').innerHTML=cats.map(function(c){var s=c.id===S.cat;
    return '<button class="cat'+(s?' sel':'')+'" data-c="'+c.id+'" style="border-left-color:'+(s?c.col:'transparent')+'"><span class="ic">'+c.ic+'</span><span class="tx"><span class="fr">'+esc(c.fr)+'</span><span class="ar">'+esc(c.ar)+'</span></span></button>'}).join('')}
function qtyInCart(id){for(var i=0;i<S.cart.length;i++)if(S.cart[i].id===id)return S.cart[i].qty;return 0}
function renderProds(){var c=S.menu.filter(function(x){return x.id===S.cat})[0];
  if(!c){$('prods').innerHTML='<div class="empty">Aucun article. Ajoutez-en dans 🔒 Gérant → Menu.</div>';return}
  $('prods').innerHTML=c.items.filter(function(it){return !it.off}).map(function(it){var act=itemActiveNow(it),q=qtyInCart(it.id);
    return '<button class="prod'+(act===false?' dim':'')+'" data-p="'+it.id+'" style="border-top-color:'+c.col+'">'+(act?'<span class="badge">Maintenant</span>':'')+(q?'<span class="cnt">'+q+'</span>':'')+
      '<span class="ic">'+(it.ic||c.ic)+'</span><span class="nm">'+esc(it.name)+'</span><span class="ar">'+esc(it.ar||'')+'</span><span class="pr">'+fmt(it.price)+'</span></button>'}).join('')}
function cartTotal(){return S.cart.reduce(function(s,l){return s+l.price*l.qty},0)}
function renderCart(){
  $('lines').innerHTML=S.cart.length?S.cart.map(function(l,i){
    return '<div class="ln"><span class="ic">'+(l.ic||'•')+'</span><div class="n">'+esc(l.name)+'<small>'+fmt(l.price)+'</small></div><div class="q"><button data-m="'+i+'" aria-label="Moins">−</button><span>'+l.qty+
      '</span><button data-a="'+i+'" aria-label="Plus">+</button></div><div class="t">'+fmt(l.price*l.qty)+'</div></div>'}).join(''):'<div class="empty">🛒<br>Touchez un produit<br>pour l\'ajouter</div>';
  $('total').textContent=fmt(cartTotal());$('bPay').disabled=!S.cart.length;$('bClear').disabled=!S.cart.length;renderProds()}
function renderTop(){var s=S.service;$('svc').innerHTML=s?'<b>'+svcLabel(s.type)+'</b> · '+hm(s.openedAt):'Aucun service';$('clock').textContent=dstr(Date.now())+' '+hm(Date.now())}
function renderAll(){renderCats();renderCart();renderTop();printerStatus();Sync.ui()}

/* ---------- caisse ---------- */
function addItem(id){var f=findIn(S.menu,id);if(!f)return;if(!S.service){openService();return}
  for(var i=0;i<S.cart.length;i++){if(S.cart[i].id===id){S.cart[i].qty++;renderCart();return}}
  S.cart.push({id:id,name:f.it.name,cat:f.cat.id,price:f.it.price,qty:1,ic:f.it.ic||f.cat.ic,detail:f.it.detail||''});renderCart()}

function openService(){if(S.service||document.querySelector('[data-open-svc]'))return;
  var h=new Date().getHours(),type=(h>=5&&h<15)?'matin':'soir',fl='';
  var m=modal({title:'Ouvrir un service',cls:'sm',locked:true,body:'<div data-open-svc></div><div class="row"><button class="chip grow" data-t="matin">☀️ Matin</button><button class="chip grow" data-t="soir">🌙 Soir</button></div>'+
    '<h3>Fond de caisse (argent déjà dans le tiroir)</h3><div class="disp" data-fd>0 DT</div><div data-kp></div>',foot:'<button class="btn gold main" data-go>Ouvrir le service</button>'});
  function sel(){each(m.qa('[data-t]'),function(b){b.className='chip grow'+(b.dataset.t===type?' sel':'')})}
  sel();each(m.qa('[data-t]'),function(b){b.onclick=function(){type=b.dataset.t;sel()}});
  keypad(m.q('[data-kp]'),{decimal:true,onChange:function(v){fl=v;m.q('[data-fd]').textContent=(v||'0')+' DT'}});
  m.q('[data-go]').onclick=function(){var f=fl?parseDT(fl):0,btn=this;if(isNaN(f)||f<0)return toast('Montant invalide');btn.disabled=true;
    var s={id:uid(),type:type,openedAt:Date.now(),closedAt:null,float:f,counted:null,expected:null,drawerOpens:0,synced:false};
    DB.put('services',s).then(function(){return DB.put('kv',s.id,'current')}).then(function(){S.service=s;renderTop();m.close();toast('Service '+type+' ouvert');Sync.schedule()})
      .catch(function(e){btn.disabled=false;toast('Erreur : '+e.message)})}}

function pay(){if(!S.cart.length)return;if(!S.service)return openService();
  var total=cartTotal(),received=total,notes=[5000,10000,20000,50000].filter(function(n){return n>total});
  var m=modal({title:'Encaisser',cls:'wide',body:'<div class="cols"><div>'+
    '<div class="muted">Total à payer</div><div class="big payamt">'+fmt(total)+'</div>'+
    '<h3>Le client donne</h3><div class="row"><button class="chip sel" data-r="'+total+'">Exact</button>'+notes.map(function(n){return '<button class="chip" data-r="'+n+'">'+(n/1000)+' DT</button>'}).join('')+'</div>'+
    '<h3>À rendre</h3><div class="big payamt" data-chg></div></div>'+
    '<div><div class="muted">Autre montant reçu</div><div class="disp" data-rd>'+fmt(total)+'</div><div data-kp></div></div></div>',
    foot:'<button class="btn" data-cc>Retour</button><button class="btn green main" data-ok>✓ Valider la vente</button>'});
  function upd(){var c=received-total,el=m.q('[data-chg]');el.textContent=c>=0?fmt(c):'Manque '+fmt(-c);el.style.color=c>=0?'':'var(--danger)';m.q('[data-ok]').disabled=c<0}
  keypad(m.q('[data-kp]'),{decimal:true,onChange:function(v){var n=parseDT(v);received=isNaN(n)?0:n;m.q('[data-rd]').textContent=v||'0';each(m.qa('[data-r]'),function(x){x.className='chip'});upd()}});
  each(m.qa('[data-r]'),function(b){b.onclick=function(){received=+b.dataset.r;m.q('[data-rd]').textContent=fmt(received);each(m.qa('[data-r]'),function(x){x.className='chip'+(x===b?' sel':'')});upd()}});
  m.q('[data-cc]').onclick=m.close;upd();
  m.q('[data-ok]').onclick=function(){var btn=this;btn.disabled=true;
    DB.get('kv','seq').then(function(seq){seq=(seq||0)+1;
      var sale={id:uid(),no:seq,ts:Date.now(),serviceId:S.service.id,serviceType:S.service.type,
        items:S.cart.map(function(l){var o={id:l.id,name:l.name,cat:l.cat,price:l.price,qty:l.qty};if(l.detail)o.detail=l.detail;return o}),
        total:total,received:received,change:received-total,cancelled:false,synced:false};
      return DB.put('kv',seq,'seq').then(function(){return DB.put('sales',sale)}).then(function(){return sale})})
    .then(function(sale){m.close();S.cart=[];renderCart();afterSale(sale);Sync.schedule()}).catch(function(e){btn.disabled=false;toast('Erreur : '+e.message,4000)})}}

function afterSale(sale){var st=S.settings;
  if(st.kickOnSale){if(st.printMode==='rawbt')kick();else if(Printer.dev)kick().catch(function(e){toast('Tiroir : '+e.message,4000)});else toast('Imprimante non connectée : ouvrez le tiroir à la clé',4000)}

/* ---------- rapports ---------- */
function reportBytes(r){var s=r.svc,e=new Esc(),d=ecart(r);
  e.align(1).bold(1).size(17).line(S.settings.h1).size(0).line('RAPPORT SERVICE '+(s.type==='matin'?'MATIN':'SOIR')).bold(0).line(dstr(s.openedAt)+' '+hm(s.openedAt)+' - '+(s.closedAt?hm(s.closedAt):'en cours')).align(0).sep();
  r.list.forEach(function(p){e.lr(p.qty+' x '+p.name,fmt(p.amt))});
  e.sep().bold(1).lr('CHIFFRE D\'AFFAIRES',fmt(r.ca)+' DT').bold(0).lr('Nombre de ventes',String(r.count)).lr('Annulations',r.cxCount+' ('+fmt(r.cxAmt)+')').lr('Ouvertures tiroir manuelles',String(s.drawerOpens||0)).sep()
   .lr('Fond de caisse',fmt(s.float)).lr('Attendu en caisse',fmt(r.expected));
  if(d!=null){e.lr('Compte',fmt(s.counted)).bold(1).lr('ECART',(d>=0?'+':'')+fmt(d)).bold(0)}return e.cut().bytes()}
function reportHtml(r){var s=r.svc,d=ecart(r);
  return '<div class="muted">'+svcLabel(s.type)+' · '+dstr(s.openedAt)+' '+hm(s.openedAt)+' → '+(s.closedAt?hm(s.closedAt):'en cours')+'</div>'+
  '<div class="cols" style="margin-top:6px"><div><div class="muted">Chiffre d\'affaires</div><div class="big">'+fmt(r.ca)+' DT</div></div>'+
  (d!=null?'<div><div class="muted">Écart de caisse</div><div class="big" style="color:'+(d<0?'var(--danger)':'var(--ok)')+'">'+(d<0?'▼ ':'▲ ')+(d>=0?'+':'')+fmt(d)+'</div></div>':'')+'</div>'+
  '<table style="margin-top:8px"><tr><td>Ventes</td><td class="right">'+r.count+'</td></tr><tr><td>Annulations</td><td class="right">'+r.cxCount+' ('+fmt(r.cxAmt)+' DT)</td></tr>'+
  '<tr><td>Ouvertures manuelles du tiroir</td><td class="right">'+(s.drawerOpens||0)+'</td></tr><tr><td>Fond de caisse</td><td class="right">'+fmt(s.float)+'</td></tr>'+
  '<tr><td>Attendu en caisse</td><td class="right">'+fmt(r.expected)+'</td></tr>'+(d!=null?'<tr><td>Compté</td><td class="right">'+fmt(s.counted)+'</td></tr>':'')+'</table><h3>Produits</h3>'+
  (r.list.length?'<table><tr><th>Produit</th><th class="right">Qté</th><th class="right">Montant</th></tr>'+r.list.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td class="right">'+p.qty+'</td><td class="right">'+fmt(p.amt)+'</td></tr>'}).join('')+'</table>':'<div class="muted">Aucune vente</div>')}
function printReport(r){Printer.send(reportBytes(r)).then(function(){toast('Rapport envoyé')}).catch(function(e){toast('Impression : '+e.message,4000)})}

/* ---------- synchronisation ---------- */
var Sync={busy:false,last:0,pending:0,err:null,t:null,
  setAuth:function(a){S.auth=a;DB.put('kv',a,'auth')},
  schedule:function(ms){var self=this;clearTimeout(this.t);this.t=setTimeout(function(){self.run()},ms||1500)},
  count:function(){return Promise.all([DB.all('services'),DB.all('sales')]).then(function(r){
    return {svcs:r[0].filter(function(x){return !x.synced}),sales:r[1].filter(function(x){return !x.synced})}})},
  /* jumelage automatique : si la config contient un compte caisse, la tablette s'y connecte seule une fois */
  pair:function(){var self=this,pc=window.LP_CONFIG&&LP_CONFIG.pair;if(!pc||S.auth||this.pairing||!Cloud.configured())return false;
    this.pairing=true;Cloud.login(pc.email,pc.password).then(function(a){self.setAuth(a);self.pairing=false;toast('Caisse connectée au serveur en ligne',3000);self.run()},function(){self.pairing=false});return true},
  run:function(){var self=this;if(!S.auth&&this.pair())return;if(!Cloud.configured()||!S.auth||this.busy)return this.refreshCount();
    this.busy=true;this.ui();var tok;
    return Cloud.token(S.auth,function(a){self.setAuth(a)}).then(function(t){tok=t;return self.count()}).then(function(p){
      var svcs=p.svcs,sales=p.sales,chain=Promise.resolve();
      for(var i=0;i<svcs.length;i+=200)(function(b){chain=chain.then(function(){return Cloud.upsert(tok,'services',b.map(serviceToRow))})})(svcs.slice(i,i+200));
      for(var j=0;j<sales.length;j+=200)(function(b){chain=chain.then(function(){return Cloud.upsert(tok,'sales',b.map(saleToRow))})})(sales.slice(j,j+200));
      return chain.then(function(){return self.markSynced('services',svcs)}).then(function(){return self.markSynced('sales',sales)})})
    .then(function(){return self.syncMenu(tok)})
    .then(function(){self.err=null;self.last=Date.now()},function(e){self.err=e;if(e.status===401&&S.auth){S.auth.exp=0;self.schedule(3000)}})
    .then(function(){self.busy=false;return self.refreshCount()})},
  /* marque synchronisé seulement si l'objet n'a pas changé pendant l'envoi */
  markSynced:function(store,list){return Promise.all(list.map(function(o){return DB.get(store,o.id).then(function(cur){
    if(!cur)return;var a=clone(cur),b=clone(o);delete a.synced;delete b.synced;if(JSON.stringify(a)===JSON.stringify(b)){cur.synced=true;return DB.put(store,cur)}})}))},
  syncMenu:function(tok){return Cloud.selectAll(tok,'config','key=eq.menu').then(function(rows){var r=rows[0];
    if(r&&+r.updated_at>S.menuTs){S.menu=migrateMenu(r.value);S.menuTs=+r.updated_at;
      return Promise.all([DB.put('kv',S.menu,'menu'),DB.put('kv',S.menuTs,'menuTs')]).then(function(){
        S.cart.forEach(function(l){var f=findIn(S.menu,l.id);if(f)l.price=f.it.price});renderCats();renderCart();toast('Menu mis à jour depuis le tableau de bord',3500)})}
    if(!r||S.menuTs>+r.updated_at){var ts=S.menuTs||Date.now();if(!S.menuTs){S.menuTs=ts;DB.put('kv',ts,'menuTs')}
      return Cloud.upsert(tok,'config',[{key:'menu',value:S.menu,updated_at:ts}],'key')}})},
  refreshCount:function(){var self=this;return this.count().then(function(p){self.pending=p.svcs.length+p.sales.length;self.ui()})},
  ui:function(){var c=$('cchip');if(!Cloud.configured()){c.style.display='none';return}c.style.display='';
    if(!S.auth){c.className='pchip off';c.textContent='☁️ non connecté';return}
    if(this.busy){c.className='pchip wait';c.textContent='☁️ …';return}
    if(this.err&&this.err.offline){c.className='pchip wait';c.textContent='☁️ hors ligne'+(this.pending?' · '+this.pending:'');return}
    if(this.err){c.className='pchip off';c.textContent='☁️ erreur';return}
    c.className='pchip '+(this.pending?'wait':'on');c.textContent=this.pending?'☁️ '+this.pending+' en attente':'☁️ ✓'}};
function syncAdmin(){
  var m=modal({title:'☁️ Synchronisation',cls:'sm',body:'<div data-sb></div>',foot:'<button class="btn main" data-cl>Fermer</button>'});m.q('[data-cl]').onclick=m.close;
  function draw(){var b=m.q('[data-sb]');
    if(!Cloud.configured()){b.innerHTML='<div class="warn">La synchronisation n\'est pas encore configurée (adresse du serveur manquante).</div>';return}
    if(!S.auth){b.innerHTML='<p class="muted">Connectez la caisse au compte en ligne pour sauvegarder les ventes et les voir depuis le tableau de bord.</p>'+
      '<label class="f">E-mail du compte caisse</label><input class="inp" data-em type="email" autocomplete="username"><label class="f">Mot de passe</label><input class="inp" data-pw type="password" autocomplete="current-password">'+
      '<div class="row" style="margin-top:10px"><button class="btn gold grow" data-li>Connecter la caisse</button></div>';
      b.querySelector('[data-li]').onclick=function(){var btn=this,em=b.querySelector('[data-em]').value.trim(),pw=b.querySelector('[data-pw]').value;if(!em||!pw)return toast('E-mail et mot de passe');btn.disabled=true;
        Cloud.login(em,pw).then(function(a){Sync.setAuth(a);toast('Caisse connectée');return Sync.run()}).then(draw,function(e){btn.disabled=false;toast(e.offline?'Pas de connexion internet':'Connexion refusée : '+e.message,4000)})};return}
    b.innerHTML='<div class="'+(Sync.err?'warn':'okbox')+'">Connectée : <b>'+esc(S.auth.email||'')+'</b><br>Dernière synchro : '+(Sync.last?hm(Sync.last):'—')+'<br>En attente : '+Sync.pending+(Sync.err?'<br>Problème : '+esc(Sync.err.message):'')+'</div>'+
      '<div class="row"><button class="btn gold grow" data-sn>Synchroniser maintenant</button><button class="btn" data-lo>Déconnecter</button></div>';
    b.querySelector('[data-sn]').onclick=function(){this.disabled=true;Sync.run().then(draw)};
    b.querySelector('[data-lo]').onclick=function(){confirmBox('Déconnecter la caisse du compte en ligne ?<br><span class="muted small">Les ventes restent dans la tablette.</span>','Déconnecter',function(){Sync.setAuth(null);Sync.ui();draw()},true)}}
  draw()}

/* ---------- événements ---------- */
$('cats').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;S.cat=b.dataset.c;renderCats();renderProds();$('prods').scrollTop=0});
$('prods').addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(b)addItem(b.dataset.p)});
$('lines').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.a!=null)S.cart[+b.dataset.a].qty++;if(b.dataset.m!=null){var l=S.cart[+b.dataset.m];l.qty--;if(l.qty<=0)S.cart.splice(+b.dataset.m,1)}renderCart()});
$('bClear').onclick=clearCart;$('bPay').onclick=pay;$('bHist').onclick=showHistory;$('bClose').onclick=closeService;$('bDrawer').onclick=openDrawer;$('bAdmin').onclick=adminHub;
$('pchip').onclick=function(){if(!Printer.ready())requireAdmin(settings)};$('cchip').onclick=function(){requireAdmin(syncAdmin)};
setInterval(function(){renderTop();renderProds()},30000);
setInterval(function(){Sync.run()},60000);
/* mise à jour automatique : nouvelle version publiée + caisse au repos -> rechargement */
setInterval(function(){if(!navigator.onLine)return;fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
  var m=t.match(/var VERSION='([^']+)'/);if(m&&m[1]!==VERSION&&!S.cart.length&&!document.querySelector('.ov'))location.reload()}).catch(function(){})},600000);
window.addEventListener('online',function(){Sync.schedule(500)});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- démarrage ---------- */
DB.open().then(function(){return Promise.all([DB.get('kv','menu'),DB.get('kv','settings'),DB.get('kv','current'),DB.get('kv','menuTs'),DB.get('kv','auth')])})
.then(function(r){S.menu=migrateMenu(r[0]);S.settings=Object.assign({},DEFAULT_SETTINGS,r[1]||{});S.menuTs=r[3]||0;S.auth=r[4]||null;
  if(r[0]&&r[0][0]&&Array.isArray(r[0][0].items[0]))DB.put('kv',S.menu,'menu');
  return r[2]?DB.get('services',r[2]):null})
.then(function(svc){S.service=svc||null;renderAll();function next(){if(!S.service)openService()}
  if(!S.settings.adminPin)setupPin(true,next);else next();Sync.schedule(2000);return Printer.init()})
.then(printerStatus)
.catch(function(e){document.body.innerHTML='<p style="padding:20px;color:#fff">Erreur au démarrage : '+esc(e&&e.message||e)+'</p>'});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
</script>
